<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>Coco（可可）</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">🏠</span><div><h1>Coco（可可）</h1><p>房产智能体 · 桌面版</p></div></div>
    <span class="status" id="status">未连接</span>
  </header>

  <section id="choose" class="card">
    <h2>选择你的使用方式</h2>
    <p class="sub">第一次使用，请选一种；之后可在设置里随时切换。</p>
    <div class="modes">
      <button class="mode" id="m1">
        <b>① 我有服务器</b>
        <span>Coco 已经装在服务器上，这里只作为操作界面（推荐 · 电脑关机也不影响机器人）</span>
      </button>
      <button class="mode" id="m2">
        <b>② 我没有服务器</b>
        <span>直接在这台电脑上安装 Coco（含数据库）。注意：电脑关机或休眠时，机器人会暂时不在线</span>
      </button>
    </div>
  </section>

  <section id="remote" class="card hide">
    <h2>连接我的服务器</h2>
    <label>服务器地址 <input id="url" placeholder="http://你的服务器IP:9119" /></label>
    <label>访问令牌 <input id="token" type="password" placeholder="在服务器上执行 hermes dashboard 时给出" /></label>
    <div class="row"><button class="primary" id="save1">保存并连接</button><button id="back1">返回</button></div>
  </section>

  <section id="local" class="card hide">
    <h2>在这台电脑上安装 Coco</h2>
    <p class="sub">将自动准备：Python 运行环境 · 便携数据库 · Coco 程序（约 400MB，视网速 3~10 分钟）</p>
    <ol id="steps">
      <li data-k="node">准备运行环境</li><li data-k="pg">准备数据库</li>
      <li data-k="code">下载 Coco 程序</li><li data-k="deps">安装依赖</li>
      <li data-k="feishu">配置飞书与模型</li>
    </ol>
    <div class="row"><button class="primary" id="go">开始安装</button><button id="back2">返回</button></div>
    <p class="note">安装完成后，机器人由本机提供服务：<b>电脑关机/休眠期间收不到消息</b>。</p>
  </section>
</div>
<script src="app.js"></script></body></html>
