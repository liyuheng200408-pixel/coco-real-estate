name: Desktop Windows installer

# Builds the desktop shell into a downloadable Windows installer (.exe) with
# electron-builder, so the packaged app can be produced without a Windows
# machine and without touching the release pipeline.
#
# Scope: this workflow ONLY produces an uploaded build artifact. It never
# publishes a GitHub Release, never tags, and only ever runs for the desktop
# branch named below (or by hand via workflow_dispatch).

on:
  push:
    branches: [feat/desktop-app]
    paths:
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-windows.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Node matching the repo's engines range (^22.22 || ^24.11 || >=26).
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      # The repo's lifecycle-script allowlist (root package.json "allowScripts")
      # is honored by npm 11.17+/12.x, so electron's binary download, node-pty's
      # native build and get-windows' node-pre-gyp install all run.
      - name: Align npm
        shell: pwsh
        run: |
          $v = (npm --version).Trim()
          if ($v -notlike '12.*') { npm i -g npm@12 }
          Write-Host "node $((node -v).Trim()) / npm $((npm --version).Trim())"

      # Full workspace install from the repo root: the desktop build consumes
      # packages hoisted to the root node_modules (vite, electron,
      # electron-builder) and the desktop scripts stage native deps out of it.
      # Scripts stay ON -- electron's postinstall downloads the runtime we
      # package, and node-pty/get-windows need their native payloads.
      - name: Install dependencies
        shell: pwsh
        run: |
          function Run-WithRetry([string]$label, [scriptblock]$body) {
            for ($i = 1; $i -le 2; $i++) {
              Write-Host "::group::$label (attempt $i)"
              $global:LASTEXITCODE = 0
              & $body
              $code = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($code -eq 0) { return $true }
              Write-Host "::warning::$label attempt $i failed (exit $code)"
              if ($i -lt 2) { Start-Sleep -Seconds 15 }
            }
            return $false
          }

          # npm ci is the reproducible path, but it refuses to run while the
          # committed lock file does not describe every workspace (a workspace
          # added without a lockfile refresh). Fall back to npm install, which
          # resolves the missing entries instead of hard-failing the job.
          if (Run-WithRetry "npm ci" { npm ci }) { exit 0 }
          Write-Host "::warning::npm ci could not run against the committed lock file; falling back to npm install"
          if (Run-WithRetry "npm install" { npm install --no-audit --no-fund }) { exit 0 }
          throw "dependency install failed (npm ci and npm install)"

      # The installer pins first-launch bootstrap to the commit it was built
      # from; $GITHUB_SHA / $GITHUB_REF_NAME give it the CI ref.
      - name: Write build stamp
        shell: pwsh
        run: node apps/desktop/scripts/write-build-stamp.mjs

      # COCO-PATCH: 安装包的文件名来自 apps/desktop/package.json 的 version
      # （artifactName 用 ${version}），而 Coco 的版本权威是仓库根 VERSION —— 两处不同步时，
      # 打出来的包会带着上一次手改的旧号（实测：VERSION 已是 0.21.3-55，包名却是
      # Coco-0.21.3-53-win-x64.exe）。构建时统一盖章，避免以后每发一版都要记得手改这里。
      - name: Stamp the Coco version into the desktop package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$') { throw "VERSION 格式异常：$v" }
          node -e "const fs=require('fs');const p='apps/desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+String.fromCharCode(10));console.log('desktop version ->',j.version)" $v
          $stamped = node -e "console.log(require('./apps/desktop/package.json').version)"
          if ($stamped.Trim() -ne $v) { throw "盖章失败：package.json=$stamped VERSION=$v" }

      # prebuild -> assert-root-install + tsc clean; build -> vite build +
      # esbuild bundle of the electron main + native dep staging; postbuild ->
      # assert dist/ is actually there.
      - name: Build renderer and electron main
        working-directory: apps/desktop
        shell: pwsh
        run: npm run build

      # Unsigned on purpose (no certificate in CI) -- electron-builder only
      # warns and the resulting installer is still fully functional for a
      # try-it-out run. NSIS only: the msi target is not built here.
      - name: Package Windows installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run builder -- --win nsis

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem apps/desktop/release/*.exe -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            Write-Host "release/ contents:"
            Get-ChildItem apps/desktop/release -ErrorAction SilentlyContinue | Select-Object Name, Length
            throw "electron-builder produced no installer .exe"
          }
          foreach ($exe in $exes) {
            Write-Host ("{0}  {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))
          }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coco-desktop-windows-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 30
