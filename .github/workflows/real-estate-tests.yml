name: Real Estate Tests

# Coco 房产模块专用 CI：只测房产代码，与上游 Hermes CI 互不干扰
on:
  push:
    branches: [master]
    paths:
      - 'tools/real_estate_*'
      - 'agent/real_estate_*'
      - 'tests/real_estate/**'
      - '.github/workflows/real-estate-tests.yml'
  pull_request:
    paths:
      - 'tools/real_estate_*'
      - 'agent/real_estate_*'
      - 'tests/real_estate/**'
      - '.github/workflows/real-estate-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy cryptography pytest pyyaml httpx python-dateutil

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q agent/real_estate_db.py agent/real_estate_prompt.py
          python -m compileall -q tools/real_estate_*.py

      - name: Run real estate test suite
        env:
          # 确保测试环境无任何生产凭证
          COCO_ENC_KEY: ""
          DATABASE_URL: ""
        run: |
          python -m pytest tests/real_estate/ -v --tb=short
