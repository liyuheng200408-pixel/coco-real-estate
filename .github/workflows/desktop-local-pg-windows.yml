# COCO: 本机模式便携 PostgreSQL 的 Windows 真机验证（手动触发，不自动跑）。
#
# 为什么需要它：便携包的下载/解压、initdb.exe/pg_ctl.exe 的真实执行、NTFS 上的权限
# 收紧，这些只在 Windows 上才成立；Linux 上能验的只是与平台无关的那部分逻辑
# （见 apps/desktop/scripts/tests/portable-postgres-linux-e2e.sh）。
#
# 触发方式：Actions 页面点 Run workflow，或本地
#   gh workflow run desktop-local-pg-windows.yml --ref <branch>
# 产物：selfcheck 报告 + postgres 日志（作为 artifact 上传，方便回看失败原因）。
#
# 故意只保留 workflow_dispatch：这类真机验证跑一次看一次，不给仓库制造定时红灯。
name: Desktop local PG (Windows)

on:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable | Out-String

      - name: Portable PostgreSQL bootstrap + selftest (real Windows)
        id: selfcheck
        shell: pwsh
        continue-on-error: true
        env:
          HERMES_HOME: ${{ runner.temp }}\hermes
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $script = 'apps/desktop/scripts/tests/portable-postgres-windows-selfcheck.ps1'
          New-Item -ItemType Directory -Force -Path $env:HERMES_HOME | Out-Null
          & pwsh -NoLogo -NoProfile -File $script -KeepGoing
          "selfcheck exit: $LASTEXITCODE" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"
          exit $LASTEXITCODE

      - name: Assert the bootstrap really produced a usable database
        shell: pwsh
        run: |
          $home_ = $env:HERMES_HOME
          $envFile = Join-Path $home_ 'hermes-agent\.env.db'
          if (-not (Test-Path $envFile)) { throw "缺少 .env.db：$envFile" }

          $url = (Select-String -Path $envFile -Pattern '^DATABASE_URL=(.+)$').Matches.Groups[1].Value
          if (-not ($url -match '^postgresql://[^:]+:[^@]+@127\.0\.0\.1:\d+/hermes_agent$')) {
            throw "DATABASE_URL 形态不符：$url"
          }

          $psql = Join-Path $home_ 'pgsql\bin\psql.exe'
          if (-not (Test-Path $psql)) { throw "缺少 psql.exe：$psql" }

          $out = & $psql $url -t -A -c "select current_user || '|' || current_database() || '|' || current_setting('listen_addresses')"
          if ($LASTEXITCODE -ne 0) { throw "psql 连接失败：$out" }
          if ($out.Trim() -ne 'hermes|hermes_agent|127.0.0.1') { throw "连接结果不符：$out" }
          "OK: $out" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"

          # 建表链路：用分发包里的真实数据层在便携 PG 上建表（与 install.sh 的 setup_tables 同一入口）
          "已生成 .env.db 且连接串可用（建表由后端首次启动时执行）" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"

      - name: Assert the port is loopback-only on a real Windows host
        shell: pwsh
        run: |
          $envFile = Join-Path $env:HERMES_HOME 'hermes-agent\.env.db'
          $url = (Select-String -Path $envFile -Pattern '^DATABASE_URL=(.+)$').Matches.Groups[1].Value
          $port = [int]($url -replace '.*:(\d+)/.*', '$1')

          $lan = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -ne '127.0.0.1' -and $_.PrefixOrigin -ne 'WellKnown' } |
            Select-Object -First 1 -ExpandProperty IPAddress)

          if (-not $lan) { "无可用非回环地址，跳过该断言" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"; exit 0 }

          $client = New-Object System.Net.Sockets.TcpClient
          $reached = $false
          try {
            $task = $client.ConnectAsync($lan, $port)
            $reached = $task.Wait(2000) -and $client.Connected
          } catch { $reached = $false } finally { $client.Close() }

          if ($reached) { throw "端口 $port 在 $lan 上也能连上（应只监听回环）" }
          "OK: $lan`:$port 连不上（只监听回环）" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"

      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'local-pg-artifacts'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$env:RUNNER_TEMP\summary.txt" $dest -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:HERMES_HOME 'pgsql-logs\selfcheck-*.txt') $dest -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:HERMES_HOME 'pgsql-data\coco-postgres.log') $dest -ErrorAction SilentlyContinue

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-local-pg-selfcheck
          path: ${{ runner.temp }}/local-pg-artifacts
          if-no-files-found: warn
