# COCO: 本机模式便携 PostgreSQL 的 Windows 真机验证（手动触发，不自动跑）。
#
# 为什么需要它：便携包的下载/解压、initdb.exe/pg_ctl.exe 的真实执行、NTFS 上的权限
# 收紧，这些只在 Windows 上才成立；Linux 上能验的只是与平台无关的那部分逻辑
# （见 apps/desktop/scripts/tests/portable-postgres-linux-e2e.sh）。
#
# 触发方式：Actions 页面点 Run workflow，或本地
#   gh workflow run desktop-local-pg-windows.yml --ref <branch>
# 产物：selfcheck 报告 + postgres 日志（作为 artifact 上传，方便回看失败原因）。
#
# 故意只保留 workflow_dispatch：这类真机验证跑一次看一次，不给仓库制造定时红灯。
name: Desktop local PG (Windows)

on:
  # workflow_dispatch 只在工作流已存在于默认分支后才可点；这条分支还没合并，
  # 所以先用「只在 feat/desktop-local-pg 上触发的 push」拿到真机结果。
  # 分支限定保证不会给 master/tag 制造噪声；合并后可只留 workflow_dispatch。
  push:
    branches:
      - feat/desktop-local-pg
    paths:
      - 'apps/desktop/scripts/portable-postgres.ps1'
      - 'apps/desktop/scripts/tests/portable-postgres-windows-selfcheck.ps1'
      - '.github/workflows/desktop-local-pg-windows.yml'
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: windows-latest
    # 338MB 便携包 + initdb + 启动：慢机器上要留足时间。之前 40 分钟不够是因为下载
    # 静默挂住（已修：脚本现在 60 秒无速度就换源），这里的余量是给正常慢场景的。
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable | Out-String

      # 下载单独成步：把「网络问题」和「脚本逻辑问题」分开，失败时一眼看出是哪种。
      # 带 --speed-limit/--speed-time：源被限速就 60 秒内失败，而不是静默挂半小时。
      - name: Pre-download the portable PostgreSQL archive (visible progress)
        id: download
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'postgresql-16.4-1-windows-x64-binaries.zip'
          $url = 'https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64-binaries.zip'
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & curl.exe -fSL -o $zip `
            --connect-timeout 20 --speed-limit 51200 --speed-time 60 `
            --retry 3 --retry-delay 5 --max-time 1500 $url
          $code = $LASTEXITCODE
          $sw.Stop()
          if ($code -ne 0) { throw "下载失败（curl 退出码 $code，用时 $([math]::Round($sw.Elapsed.TotalSeconds)) 秒）—— 说明 GitHub runner 到该源不通/被限速" }
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          $rate = [math]::Round($mb / [math]::Max($sw.Elapsed.TotalSeconds, 0.1), 2)
          $line = "下载完成：$mb MB，用时 $([math]::Round($sw.Elapsed.TotalSeconds, 1)) 秒（$rate MB/s）"
          $line | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"
          if ($mb -lt 150) { throw "包体积异常：$mb MB" }
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Portable PostgreSQL bootstrap + selftest (real Windows, offline)
        id: selfcheck
        shell: pwsh
        continue-on-error: true
        env:
          HERMES_HOME: ${{ runner.temp }}\hermes
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $script = 'apps/desktop/scripts/tests/portable-postgres-windows-selfcheck.ps1'
          New-Item -ItemType Directory -Force -Path $env:HERMES_HOME | Out-Null

          # 同样不能用管道捕获：自检会拉起常驻 postgres.exe，它会继承管道的句柄，
          # 管道不 EOF 就会一直等（实测卡到 job 超时）。文件重定向 + 边跑边读。
          $log = Join-Path $env:RUNNER_TEMP 'selfcheck-output.log'
          $proc = Start-Process -FilePath 'pwsh' -ArgumentList @(
            '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $script, '-KeepGoing',
            '-ZipPath', '${{ steps.download.outputs.zip }}'
          ) -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"

          $seen = 0
          while (-not $proc.HasExited) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) {
              $lines = @(Get-Content $log -ErrorAction SilentlyContinue)
              while ($seen -lt $lines.Count) { Write-Host $lines[$seen]; $seen++ }
            }
          }
          foreach ($f in @($log, "$log.err")) {
            if (Test-Path $f) {
              $lines = @(Get-Content $f -ErrorAction SilentlyContinue)
              while ($seen -lt $lines.Count) { Write-Host $lines[$seen]; $seen++ }
            }
          }

          $code = $proc.ExitCode
          "selfcheck exit: $code" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"
          if ($code -ne 0) { exit $code }

      - name: Assert the bootstrap really produced a usable database
        shell: pwsh
        run: |
          $home_ = $env:HERMES_HOME
          $envFile = Join-Path $home_ 'hermes-agent\.env.db'
          if (-not (Test-Path $envFile)) { throw "缺少 .env.db：$envFile" }

          $url = (Select-String -Path $envFile -Pattern '^DATABASE_URL=(.+)$').Matches.Groups[1].Value
          if (-not ($url -match '^postgresql://[^:]+:[^@]+@127\.0\.0\.1:\d+/hermes_agent$')) {
            throw "DATABASE_URL 形态不符：$url"
          }

          $psql = Join-Path $home_ 'pgsql\bin\psql.exe'
          if (-not (Test-Path $psql)) { throw "缺少 psql.exe：$psql" }

          $out = & $psql $url -t -A -c "select current_user || '|' || current_database() || '|' || current_setting('listen_addresses')"
          if ($LASTEXITCODE -ne 0) { throw "psql 连接失败：$out" }
          if ($out.Trim() -ne 'hermes|hermes_agent|127.0.0.1') { throw "连接结果不符：$out" }
          "OK: $out" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"

          # 建表链路：用分发包里的真实数据层在便携 PG 上建表（与 install.sh 的 setup_tables 同一入口）
          "已生成 .env.db 且连接串可用（建表由后端首次启动时执行）" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"

      - name: Assert the port is loopback-only on a real Windows host
        shell: pwsh
        run: |
          $envFile = Join-Path $env:HERMES_HOME 'hermes-agent\.env.db'
          $url = (Select-String -Path $envFile -Pattern '^DATABASE_URL=(.+)$').Matches.Groups[1].Value
          $port = [int]($url -replace '.*:(\d+)/.*', '$1')

          $lan = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -ne '127.0.0.1' -and $_.PrefixOrigin -ne 'WellKnown' } |
            Select-Object -First 1 -ExpandProperty IPAddress)

          if (-not $lan) { "无可用非回环地址，跳过该断言" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"; exit 0 }

          $client = New-Object System.Net.Sockets.TcpClient
          $reached = $false
          try {
            $task = $client.ConnectAsync($lan, $port)
            $reached = $task.Wait(2000) -and $client.Connected
          } catch { $reached = $false } finally { $client.Close() }

          if ($reached) { throw "端口 $port 在 $lan 上也能连上（应只监听回环）" }
          "OK: $lan`:$port 连不上（只监听回环）" | Tee-Object -Append "$env:RUNNER_TEMP\summary.txt"

      # 退出前把数据库停掉：既是最干净的收尾，也避免常驻的 postgres 继续攥着
      # 继承来的句柄让 runner 收尾时干等。
      - name: Stop the portable database
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bootstrap = 'apps/desktop/scripts/portable-postgres.ps1'
          $home_ = $env:HERMES_HOME
          & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File $bootstrap `
              -Action stop -DataRoot (Join-Path $home_ 'pgsql') -DataDir (Join-Path $home_ 'pgsql-data') `
              -EnvFile (Join-Path $home_ 'hermes-agent\.env.db') -PgBinDir (Join-Path $home_ 'pgsql\bin')

      - name: Collect artifacts
        if: always()
        continue-on-error: true   # 缺文件不该把整个 job 判红（之前的失败就是这里）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = Join-Path $env:RUNNER_TEMP 'local-pg-artifacts'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($p in @(
              (Join-Path $env:RUNNER_TEMP 'summary.txt'),
              (Join-Path $env:HERMES_HOME 'pgsql-logs\selfcheck-*.txt'),
              (Join-Path $env:HERMES_HOME 'pgsql-data\coco-postgres.log'))) {
            Copy-Item -Path $p -Destination $dest -ErrorAction SilentlyContinue -Force
          }
          Get-ChildItem -Path $dest -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-local-pg-selfcheck
          path: ${{ runner.temp }}/local-pg-artifacts
          if-no-files-found: warn
